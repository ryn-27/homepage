<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryne Angelo Rigor - Multimedia Arts Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #0d0e12;
      color: #e2e8f0;
      height: 100vh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }

    .font-retro {
      font-family: 'VT323', monospace;
    }

    /* Classic Windows/Retro Bevel Borders */
    .bevel-out {
      border: 2px solid;
      border-color: #3b4252 #1a1c23 #1a1c23 #3b4252;
    }

    .bevel-in {
      border: 2px solid;
      border-color: #1a1c23 #3b4252 #3b4252 #1a1c23;
    }

    /* Stepped Retro Pixel Fade Bridge */
    .pixel-fade-right {
      background: linear-gradient(
        to right,
        #202430 0%,
        #202430 25%,
        rgba(32, 36, 48, 0.85) 25%,
        rgba(32, 36, 48, 0.85) 50%,
        rgba(32, 36, 48, 0.45) 50%,
        rgba(32, 36, 48, 0.45) 75%,
        transparent 75%,
        transparent 100%
      );
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #161821;
    }
    ::-webkit-scrollbar-thumb {
      background: #2e3440;
      border-radius: 3px;
    }
  </style>
</head>
<body class="flex items-center justify-center h-screen w-screen p-0 m-0 overflow-hidden bg-[#0d0e12]">

  <!-- Main Retro Window Container (Edge-to-Edge 100vw x 100vh) -->
  <div class="w-screen h-screen bg-[#161821] bevel-out rounded-none shadow-2xl flex flex-col overflow-hidden">
    
    <!-- 1. Retro Title Bar (Classic Windows Blue Gradient) -->
    <div class="bg-gradient-to-r from-[#0a5bc4] to-[#3a92d8] px-3 py-1.5 flex items-center justify-between border-b border-[#2e3440] shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-3.5 h-3.5 bg-white rounded-sm"></div>
        <span class="font-retro text-lg tracking-wider text-white drop-shadow">Ryne Angelo Rigor — Multimedia Arts Studio</span>
      </div>
      <!-- Decorative Non-Clickable Controls -->
      <div class="flex items-center gap-1.5 opacity-90">
        <div class="w-5 h-5 bg-[#d6dbe3] bevel-out flex items-center justify-center text-xs font-bold text-black cursor-default">_</div>
        <div class="w-5 h-5 bg-[#d6dbe3] bevel-out flex items-center justify-center text-xs font-bold text-black cursor-default">□</div>
        <div class="w-5 h-5 bg-[#d6dbe3] bevel-out flex items-center justify-center text-xs font-bold text-black cursor-default">×</div>
      </div>
    </div>

    <!-- 2. Retro Menu Bar (Static / Non-clickable) -->
    <div class="bg-[#1a1c23] px-3 py-1 text-xs text-gray-400 font-retro border-b border-[#252934] flex gap-4 shrink-0">
      <span class="hover:text-gray-400 cursor-default">File</span>
      <span class="hover:text-gray-400 cursor-default">Edit</span>
      <span class="hover:text-gray-400 cursor-default">View</span>
      <span class="hover:text-gray-400 cursor-default">Go</span>
      <span class="hover:text-gray-400 cursor-default">Help</span>
    </div>

    <!-- 3. Main Body Workspace -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden p-3 md:p-4 gap-4 bg-[#0f1117]">

        <div class="space-y-1.5 min-h-0 flex flex-col">

          <!-- FLAT ROSTER STAGE: Multiple Flat Locked Shadow Cards on Left & Right + Center P1 -->

            <div aria-hidden="true"

              <span class="font-retro text-gray-700 text-xs">?</span>
            </div>

            <!-- Inner-Left Flat Locked Shadow Card -->
            <div aria-hidden="true"

              <span class="font-retro text-gray-600 text-sm">?</span>
              <span class="font-retro text-[8px] text-gray-700 tracking-tighter">LOCK</span>
            </div>

            <!-- Center Active P1 Character Card (Flat, Crisp, Full-Body Frame) -->
            <div class="relative z-10 w-44 bg-[#202430] bevel-out p-1.5 space-y-1 shadow-2xl">
              <!-- Top-Right P1 Seal -->
              <div class="absolute -top-2 -right-2 z-20 bg-[#b91c1c] text-white font-retro text-xs font-bold px-2 py-0.2 border-2 border-[#facc15] shadow-md tracking-wider">
                P1
              </div>

              <!-- Large Full-Body Formal Portrait (Head-to-Toe) -->
              <div onclick="openLightbox('formal.jpg', 'Ryne Angelo Rigor — Formal Attire')"
                   class="w-full h-80 bg-[#161821] bevel-in overflow-hidden relative cursor-pointer group flex items-center justify-center">

                     class="w-full h-full object-contain group-hover:scale-105 transition duration-300">
                <span class="absolute bottom-1.5 right-1.5 bg-black/85 text-[#00d2c4] text-[10px] font-retro px-1.5 py-0.2 border border-[#3b4252]">
                  [+ ZOOM]
                </span>
              </div>

              <!-- Retro RPG Stat Bars (HP 50%, ATK 50%, SPD 75%) -->
              <div class="space-y-1 font-retro text-[11px] leading-none bg-[#161821] bevel-in p-1.5">
                <div class="flex items-center gap-1.5">
                  <span class="text-[#00d2c4] w-6">HP</span>
                  <div class="flex-1 h-1.5 bg-[#252934] overflow-hidden">
                    <div class="h-full bg-emerald-400 w-[50%]"></div>
                  </div>
                  <span class="text-white w-4 text-right">50</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="text-[#00d2c4] w-6">ATK</span>
                  <div class="flex-1 h-1.5 bg-[#252934] overflow-hidden">
                    <div class="h-full bg-amber-400 w-[50%]"></div>
                  </div>
                  <span class="text-white w-4 text-right">50</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="text-[#00d2c4] w-6">SPD</span>
                  <div class="flex-1 h-1.5 bg-[#252934] overflow-hidden">
                    <div class="h-full bg-cyan-400 w-[75%]"></div>
                  </div>
                  <span class="text-white w-4 text-right">75</span>
                </div>
              </div>
            </div>
